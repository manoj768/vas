version: '3.8'

services:
  app:
    build: .
    container_name: valuation_studio_app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/evalo_valuation
      - MONGODB_DB_NAME=evalo_valuation
      - JWT_SECRET=evalo_production_jwt_secret_2026
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET_NAME=valuation-photos
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongo
      - minio
    restart: always

  mongo:
    image: mongo:7.0
    container_name: valuation_studio_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  minio:
    image: minio/minio:latest
    container_name: valuation_studio_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  mongo_data:
  minio_data:
